<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送迎予約 試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap">
<style>
:root{--ink:#1B1A17;--body:#35332E;--muted:#5F5C54;--paper:#FFFFFF;--bg:#F6F5F1;--line:#C9C6BC;--tint:#EFEDE6;--pale:#FBF1C2;--pale-ink:#3F3200;--strong:#1B1A17;--on-strong:#FFFFFF;--warn:#8A2F12;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F3F1EA;--body:#DAD7CD;--muted:#A9A69B;--paper:#22211D;--bg:#191815;--line:#4A483F;--tint:#302E28;--pale:#4A3F12;--pale-ink:#FBF1C2;--strong:#F3F1EA;--on-strong:#1B1A17;--warn:#F2A488;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#F3F1EA;--body:#DAD7CD;--muted:#A9A69B;--paper:#22211D;--bg:#191815;--line:#4A483F;--tint:#302E28;--pale:#4A3F12;--pale-ink:#FBF1C2;--strong:#F3F1EA;--on-strong:#1B1A17;--warn:#F2A488;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:'Noto Sans JP','Yu Gothic',sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-family:'Noto Serif JP','Yu Mincho',serif;font-size:21px;line-height:1.4;color:var(--ink)}
h2{font-family:'Noto Serif JP','Yu Mincho',serif;font-size:17px;color:var(--ink);border-bottom:1.5px solid var(--ink);padding-bottom:3px;margin-bottom:10px}
.sub{font-size:13px;color:var(--muted)}
.notice{background:var(--pale);color:var(--pale-ink);font-size:13px;padding:8px 12px;margin:12px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:12px 0 16px;border:1.5px solid var(--strong)}
.tabs button{appearance:none;border:0;background:var(--paper);color:var(--ink);font:inherit;font-weight:700;padding:11px 4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--strong);color:var(--on-strong)}
.badge{display:inline-block;background:var(--pale);color:var(--pale-ink);font-size:12px;font-weight:700;padding:0 6px;margin-left:4px}
section{background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:14px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
select,input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:9px;min-height:44px}
textarea{min-height:64px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
body{overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--strong)}
.seg button{appearance:none;border:0;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;padding:9px 2px;min-height:44px;cursor:pointer;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--strong);color:var(--on-strong);font-weight:700}
.week{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin:12px 0 8px}
.week b{text-align:center;color:var(--ink)}
.btn{appearance:none;border:1px solid var(--strong);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;min-height:44px;cursor:pointer}
.btn.main{background:var(--strong);color:var(--on-strong);font-weight:700;width:100%;margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;font-weight:700;color:var(--muted);padding:3px 2px;text-align:center}
th small{display:block;font-weight:400}
td{padding:2px}
td.d{font-weight:700;color:var(--ink);font-size:14px;width:62px;white-space:nowrap}
td.d small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.slot{appearance:none;width:100%;min-height:44px;border:1px solid var(--strong);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.slot.few{background:var(--pale);border-color:var(--pale);color:var(--pale-ink)}
.slot.off{background:var(--tint);border-color:var(--tint);color:var(--muted);cursor:default}
.slot.sel{background:var(--strong);border-color:var(--strong);color:var(--on-strong);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid var(--strong);vertical-align:-1px;margin-right:3px}
.sum{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:10px}
.sum b{color:var(--ink);text-align:right}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.msg{font-size:14px;margin-top:8px;min-height:1.4em}
.msg.ok{color:var(--ink);font-weight:700}
.msg.err{color:var(--warn);font-weight:700}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px}
.item:first-of-type{border-top:0}
.item .t{flex:1 1 230px;min-width:0}
.item b{color:var(--ink)}
.item .memo{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.acts .btn{padding:6px 10px;min-height:40px}
.acts .btn.go{background:var(--strong);color:var(--on-strong);font-weight:700}
.st{display:inline-block;font-size:12px;font-weight:700;padding:0 6px;border:1px solid var(--line);margin-left:4px;white-space:nowrap}
.st.requested{background:var(--pale);border-color:var(--pale);color:var(--pale-ink)}
.st.confirmed{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.st.declined,.st.cancelled{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.grid td{border:1px solid var(--line);text-align:center;font-size:12.5px;padding:5px 2px;line-height:1.35}
.grid td.d{border:0;text-align:left}
.grid td.busy{background:var(--pale);color:var(--pale-ink)}
.grid td.full{background:var(--tint);font-weight:700;color:var(--ink)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>デイサービス送迎 予約（試作）</h1>
  <p class="sub">有限会社 富士タクシー</p>
  <p class="notice">試験用の試作です。ここでの予約は本番の配車には反映されません。利用者様のお名前は入力しないでください。</p>
  <p class="notice hidden" id="mode"></p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabF" aria-selected="true">介護事業所の画面</button>
    <button role="tab" id="tabO" aria-selected="false">事務所の画面<span class="badge hidden" id="pending"></span></button>
  </div>

  <div id="viewF">
    <section>
      <div class="row2">
        <div><label class="f" for="fac">事業所（見本）</label>
          <select id="fac"><option>デイサービスA</option><option>デイサービスB</option><option>デイサービスC</option></select></div>
        <div><span class="f" style="display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px">車種</span>
          <div class="seg" id="car"><button data-car="jumbo" aria-pressed="true">ジャンボ<br>最大9名</button><button data-car="normal" aria-pressed="false">普通<br>最大4名</button></div></div>
      </div>
      <div class="week"><button class="btn" id="prevF" aria-label="前の週">前の週</button><b id="labelF"></b><button class="btn" id="nextF" aria-label="次の週">次の週</button></div>
      <table><thead><tr><th style="width:62px"></th><th>朝の部<small>8:00〜10:00</small></th><th>夕の部<small>16:00〜18:00</small></th></tr></thead><tbody id="cal"></tbody></table>
      <div class="legend"><span><i class="sw"></i>空きあり</span><span><i class="sw" style="background:var(--pale);border-color:var(--pale)"></i>残り1台</span><span><i class="sw" style="background:var(--tint);border-color:var(--tint)"></i>満・受付終了</span></div>
      <p class="hint">受付は前日17時まで（試作の仮設定）。</p>
    </section>
    <section>
      <h2>予約の内容</h2>
      <div class="sum"><span>日時</span><b id="picked">上の表から選んでください</b></div>
      <div class="sum"><span>車種</span><b id="pickedCar"></b></div>
      <label class="f" for="people">人数</label>
      <input type="number" id="people" min="1" max="9" value="4" inputmode="numeric">
      <label class="f" for="memo" style="margin-top:10px">連絡事項（任意）</label>
      <textarea id="memo" maxlength="200" placeholder="例：車いす1台あり。お名前は書かないでください。"></textarea>
      <button class="btn main" id="send" disabled>予約を送る</button>
      <p class="msg" id="msgF" role="status"></p>
    </section>
    <section>
      <h2>この事業所の予約</h2>
      <div id="mine"></div>
    </section>
  </div>

  <div id="viewO" class="hidden">
    <section>
      <h2>届いた予約</h2>
      <div class="seg" id="filter" style="margin-bottom:8px"><button data-f="open" aria-pressed="true">対応が必要</button><button data-f="all" aria-pressed="false">すべて</button></div>
      <div id="list"></div>
      <p class="msg" id="msgO" role="status"></p>
    </section>
    <section>
      <h2>週の状況</h2>
      <div class="week" style="margin-top:0"><button class="btn" id="prevO">前の週</button><b id="labelO"></b><button class="btn" id="nextO">次の週</button></div>
      <table class="grid"><thead><tr><th style="width:62px"></th><th>朝の部</th><th>夕の部</th></tr></thead><tbody id="grid"></tbody></table>
      <p class="hint">予約数／受付台数。依頼中と相談中も数えています。</p>
    </section>
    <section>
      <h2>受付台数（1つの時間枠あたり）</h2>
      <div class="row2">
        <div><label class="f" for="capJ">ジャンボ</label><input type="number" id="capJ" min="0" max="7"></div>
        <div><label class="f" for="capN">普通</label><input type="number" id="capN" min="0" max="10"></div>
      </div>
      <p class="hint">電話の配車用に残す分を引いた台数です。試作では全日共通です。</p>
      <button class="btn main" id="saveCap">受付台数を保存</button>
      <p class="msg" id="msgC" role="status"></p>
    </section>
  </div>
</div>

<script>
(function(){
'use strict';
var SLOTS={am:'朝の部',pm:'夕の部'},CARS={jumbo:'ジャンボ',normal:'普通'},MAXP={jumbo:9,normal:4};
var STATUS={requested:'依頼中',confirmed:'確定',consult:'相談中',declined:'お断り',cancelled:'取消'};
var HOLD={requested:1,confirmed:1,consult:1};
var DOW=['日','月','火','水','木','金','土'];
var state={bookings:[],cap:{jumbo:2,normal:2},car:'jumbo',pick:null,weekF:0,weekO:0,filter:'open'};
var store=null;
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function label(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+DOW[d.getDay()]+'）';}
function monday(off){var d=new Date();d.setHours(0,0,0,0);var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w+7*off);return d;}
function days(off){var m=monday(off),a=[];for(var i=0;i<6;i++){var d=new Date(m);d.setDate(m.getDate()+i);a.push(d);}return a;}
function weekLabel(off){var a=days(off),s=a[0],e=a[5];return (s.getMonth()+1)+'/'+s.getDate()+' 〜 '+(e.getMonth()+1)+'/'+e.getDate();}
function closed(ds){var limit=parse(ds);limit.setDate(limit.getDate()-1);limit.setHours(17,0,0,0);return new Date()>=limit;}
function used(ds,slot,car){return state.bookings.filter(function(b){return b.date===ds&&b.slot===slot&&b.car===car&&HOLD[b.status];}).length;}
function left(ds,slot,car){return Math.max(0,(state.cap[car]||0)-used(ds,slot,car));}
function fac(){return $('fac').value;}

/* 保存先：共有データベース。使えない場面では画面内だけで動かす */
function memoryStore(){var seq=0;return{
  add:function(b){b.id='m'+(++seq);state.bookings.unshift(b);render();return Promise.resolve();},
  setStatus:function(id,st){state.bookings.forEach(function(b){if(b.id===id)b.status=st;});render();return Promise.resolve();},
  setCap:function(c){state.cap=c;render();return Promise.resolve();}
};}
function dbStore(db){
  var col=db.collection('bookings');
  var timer=setTimeout(function(){showMode('予約データにまだ接続できません。通信状況をご確認ください。');},10000);
  col.orderBy('createdAt','desc').limit(500).onSnapshot(function(s){
    clearTimeout(timer);
    if(!s.metadata.fromCache)hideMode();
    state.bookings=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
    render();
  },function(){clearTimeout(timer);showMode('予約データを読み込めませんでした。ページを開き直してください。');});
  db.doc('settings/capacity').onSnapshot(function(s){
    if(s.exists){var v=s.data();state.cap={jumbo:+v.jumbo||0,normal:+v.normal||0};render();}
  },function(){});
  return{
    add:function(b){return col.add(b);},
    setStatus:function(id,st){return col.doc(id).update({status:st,updatedAt:new Date().toISOString()});},
    setCap:function(c){return db.doc('settings/capacity').set(c);}
  };
}
function showMode(t){$('mode').textContent=t;$('mode').classList.remove('hidden');}
function hideMode(){$('mode').classList.add('hidden');}
function writeError(e){return e&&e.code==='invalid_argument'?'この画面で変更する権限がありません。':'保存できませんでした。もう一度お試しください。';}

function renderCal(){
  $('labelF').textContent=weekLabel(state.weekF);
  $('prevF').disabled=state.weekF<=0;
  var h='';
  days(state.weekF).forEach(function(d){
    var ds=iso(d);
    h+='<tr><td class="d">'+(d.getMonth()+1)+'/'+d.getDate()+'<small>'+DOW[d.getDay()]+'曜</small></td>';
    ['am','pm'].forEach(function(sl){
      var n=left(ds,sl,state.car),c=closed(ds),sel=state.pick&&state.pick.date===ds&&state.pick.slot===sl;
      var txt=c?'受付終了':n===0?'満':sel?'選択中':n===1?'残り1台':'空き '+n+'台';
      var cls='slot'+((c||n===0)?' off':sel?' sel':n===1?' few':'');
      h+='<td><button class="'+cls+'" data-d="'+ds+'" data-s="'+sl+'"'+((c||n===0)?' disabled':'')+'>'+txt+'</button></td>';
    });
    h+='</tr>';
  });
  $('cal').innerHTML=h;
  if(state.pick&&(closed(state.pick.date)||left(state.pick.date,state.pick.slot,state.car)===0))state.pick=null;
  $('picked').textContent=state.pick?label(state.pick.date)+' '+SLOTS[state.pick.slot]:'上の表から選んでください';
  $('pickedCar').textContent=CARS[state.car]+'タクシー（最大'+MAXP[state.car]+'名）';
  $('people').max=MAXP[state.car];
  $('send').disabled=!state.pick;
}
function when(b){return label(b.date)+' '+(SLOTS[b.slot]||'')+'／'+(CARS[b.car]||'')+'／'+(+b.people||0)+'名';}
function stBadge(b){return '<span class="st '+esc(b.status)+'">'+esc(STATUS[b.status]||b.status)+'</span>';}
function renderMine(){
  var me=fac(),rows=state.bookings.filter(function(b){return b.facility===me&&b.status!=='cancelled';});
  $('mine').innerHTML=rows.length?rows.map(function(b){
    var can=b.status==='requested';
    return '<div class="item"><div class="t"><b>'+esc(when(b))+'</b>'+stBadge(b)+(b.memo?'<div class="memo">'+esc(b.memo)+'</div>':'')+'</div>'+(can?'<div class="acts"><button class="btn" data-act="cancelled" data-id="'+esc(b.id)+'">取り消す</button></div>':'')+'</div>';
  }).join(''):'<p class="empty">まだ予約はありません。</p>';
}
function renderList(){
  var rows=state.bookings.filter(function(b){return state.filter==='all'||b.status==='requested'||b.status==='consult';});
  $('list').innerHTML=rows.length?rows.map(function(b){
    var a='';
    if(b.status==='requested'||b.status==='consult')a+='<button class="btn go" data-act="confirmed" data-id="'+esc(b.id)+'">確定</button>';
    if(b.status==='requested')a+='<button class="btn" data-act="consult" data-id="'+esc(b.id)+'">相談</button>';
    if(b.status==='requested'||b.status==='consult')a+='<button class="btn" data-act="declined" data-id="'+esc(b.id)+'">お断り</button>';
    if(b.status==='confirmed'||b.status==='declined')a+='<button class="btn" data-act="requested" data-id="'+esc(b.id)+'">依頼中に戻す</button>';
    return '<div class="item"><div class="t"><b>'+esc(b.facility)+'</b>'+stBadge(b)+'<div>'+esc(when(b))+'</div>'+(b.memo?'<div class="memo">'+esc(b.memo)+'</div>':'')+'</div><div class="acts">'+a+'</div></div>';
  }).join(''):'<p class="empty">'+(state.filter==='all'?'まだ予約はありません。':'対応が必要な予約はありません。')+'</p>';
  var n=state.bookings.filter(function(b){return b.status==='requested';}).length;
  $('pending').textContent=n;$('pending').classList.toggle('hidden',!n);
}
function renderGrid(){
  $('labelO').textContent=weekLabel(state.weekO);
  var h='';
  days(state.weekO).forEach(function(d){
    var ds=iso(d);
    h+='<tr><td class="d">'+(d.getMonth()+1)+'/'+d.getDate()+'<small>'+DOW[d.getDay()]+'曜</small></td>';
    ['am','pm'].forEach(function(sl){
      var j=used(ds,sl,'jumbo'),n=used(ds,sl,'normal');
      var full=j>=state.cap.jumbo&&n>=state.cap.normal;
      h+='<td class="'+(full?'full':(j||n)?'busy':'')+'">ジャンボ '+j+'/'+state.cap.jumbo+'<br>普通 '+n+'/'+state.cap.normal+'</td>';
    });
    h+='</tr>';
  });
  $('grid').innerHTML=h;
}
function render(){
  renderCal();renderMine();renderList();renderGrid();
  if(document.activeElement!==$('capJ'))$('capJ').value=state.cap.jumbo;
  if(document.activeElement!==$('capN'))$('capN').value=state.cap.normal;
}
function setStatus(id,st,msgEl){
  store.setStatus(id,st).catch(function(e){$(msgEl).className='msg err';$(msgEl).textContent=writeError(e);});
}

$('tabF').onclick=function(){switchTab(true);};
$('tabO').onclick=function(){switchTab(false);};
function switchTab(f){$('tabF').setAttribute('aria-selected',f);$('tabO').setAttribute('aria-selected',!f);$('viewF').classList.toggle('hidden',!f);$('viewO').classList.toggle('hidden',f);}
$('car').onclick=function(e){var b=e.target.closest('button');if(!b)return;state.car=b.dataset.car;state.pick=null;[].forEach.call($('car').children,function(x){x.setAttribute('aria-pressed',x===b);});if(+$('people').value>MAXP[state.car])$('people').value=MAXP[state.car];render();};
$('fac').onchange=function(){$('msgF').textContent='';renderMine();};
$('prevF').onclick=function(){if(state.weekF>0){state.weekF--;renderCal();}};
$('nextF').onclick=function(){state.weekF++;renderCal();};
$('prevO').onclick=function(){state.weekO--;renderGrid();};
$('nextO').onclick=function(){state.weekO++;renderGrid();};
$('cal').onclick=function(e){var b=e.target.closest('button');if(!b||b.disabled)return;state.pick={date:b.dataset.d,slot:b.dataset.s};$('msgF').textContent='';renderCal();};
$('send').onclick=function(){
  var m=$('msgF'),p=parseInt($('people').value,10),pick=state.pick;
  m.className='msg err';
  if(!pick){m.textContent='日時を選んでください。';return;}
  if(!(p>=1&&p<=MAXP[state.car])){m.textContent='人数は1〜'+MAXP[state.car]+'名で入力してください。';return;}
  if(closed(pick.date)||left(pick.date,pick.slot,state.car)<=0){m.textContent='この枠は受付できなくなりました。別の枠を選んでください。';state.pick=null;renderCal();return;}
  var now=new Date().toISOString();
  var doc={facility:fac(),date:pick.date,slot:pick.slot,car:state.car,people:p,memo:$('memo').value.trim().slice(0,200),status:'requested',createdAt:now,updatedAt:now};
  $('send').disabled=true;
  store.add(doc).then(function(){
    m.className='msg ok';m.textContent=label(pick.date)+' '+SLOTS[pick.slot]+'の予約を送りました。事務所の確定をお待ちください。';
    state.pick=null;$('memo').value='';render();
  },function(e){m.textContent=writeError(e);$('send').disabled=false;});
};
$('mine').onclick=function(e){var b=e.target.closest('button[data-act]');if(b)setStatus(b.dataset.id,b.dataset.act,'msgF');};
$('list').onclick=function(e){var b=e.target.closest('button[data-act]');if(b){$('msgO').textContent='';setStatus(b.dataset.id,b.dataset.act,'msgO');}};
$('filter').onclick=function(e){var b=e.target.closest('button');if(!b)return;state.filter=b.dataset.f;[].forEach.call($('filter').children,function(x){x.setAttribute('aria-pressed',x===b);});renderList();};
$('saveCap').onclick=function(){
  var j=parseInt($('capJ').value,10),n=parseInt($('capN').value,10),m=$('msgC');
  if(!(j>=0&&j<=7&&n>=0&&n<=10)){m.className='msg err';m.textContent='ジャンボは0〜7台、普通は0〜10台で入力してください。';return;}
  store.setCap({jumbo:j,normal:n}).then(function(){m.className='msg ok';m.textContent='受付台数を保存しました。';state.cap={jumbo:j,normal:n};render();},function(e){m.className='msg err';m.textContent=writeError(e);});
};

function waitClaude(){return new Promise(function(res){var t=0;(function poll(){if(window.claude&&window.claude.use)return res(window.claude);if(++t>15)return res(null);setTimeout(poll,100);})();});}
store=memoryStore();render();
waitClaude().then(function(c){return c?c.use('db'):null;}).catch(function(){return null;}).then(function(db){
  if(db){store=dbStore(db);}
  else{showMode('保存先に接続していないため、この表示の間だけ動きます。閉じると予約は消えます。');}
});
})();
</script>
</body>
</html>
